<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hill - Gino & Carlo</title>
    <style>
        :root { --accent: #22c55e; --bg: #0a0a0a; --card: #161616; }
        body { background: var(--bg); color: white; font-family: -apple-system, sans-serif; text-align: center; margin: 0; padding-bottom: 50px; }
        .banner { background: var(--accent); color: black; font-weight: 900; padding: 15px; text-transform: uppercase; }
        .match-box { background: var(--card); margin: 20px; padding: 20px; border-radius: 12px; border: 1px solid #333; }
        .player-name { font-size: 24px; font-weight: 800; color: var(--accent); display: block; }
        .list-section { padding: 0 20px; text-align: left; max-width: 500px; margin: auto; }
        h3 { border-bottom: 1px solid #333; padding-bottom: 5px; text-transform: uppercase; opacity: 0.6; margin-top: 30px; }
        .entry { background: #161616; padding: 12px; margin-bottom: 6px; border-radius: 8px; border: 1px solid #222; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="banner">Gino & Carlo - King of the Hill</div>
    <div class="match-box">
        <span style="font-size:12px; opacity:0.5;">CURRENT MATCH</span>
        <span id="kingName" class="player-name">---</span>
        <div style="margin: 10px 0; opacity: 0.3;">VS</div>
        <span id="chalName" class="player-name">---</span>
    </div>
    <div class="list-section">
        <h3>Top 5 Leaders</h3>
        <div id="leaderboardList"></div>
        <h3>The Rail</h3>
        <div id="railList"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJIICqGbSr8DwyyPtG-cRCRr4W7T7xd00",
            authDomain: "the-hill-pilot.firebaseapp.com",
            projectId: "the-hill-pilot",
            storageBucket: "the-hill-pilot.firebasestorage.app",
            messagingSenderId: "965013734125",
            appId: "1:965013734125:web:bef8fbb9029fb898d742e4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        onSnapshot(query(collection(db, "rail-ginos"), orderBy("time", "asc")), (snap) => {
            const players = snap.docs.map(d => d.data()).filter(p => p.status === "active");
            document.getElementById('kingName').innerText = players[0]?.name || "---";
            document.getElementById('chalName').innerText = players[1]?.name || "---";
            document.getElementById('railList').innerHTML = players.slice(2).map((p, i) => `
                <div class="entry"><span>${i+3}. ${p.name}</span></div>`).join('');
        });

        // LEADERBOARD: Limited to Top 5
        onSnapshot(query(collection(db, "leaderboard-ginos"), orderBy("wins", "desc")), (snap) => {
            document.getElementById('leaderboardList').innerHTML = snap.docs.slice(0, 5).map((d, i) => {
                const data = d.data();
                return `<div class="entry"><span>${i+1}. ${data.name}</span><strong>${data.wins} wins</strong></div>`;
            }).join('');
        });
    </script>
</body>
</html>
