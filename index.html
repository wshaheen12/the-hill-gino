<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Hill - Gino and Carlo</title>
    <style>
        :root { --accent: #22c55e; --bg: #0a0a0a; --card: #161616; }
        body { background: var(--bg); color: white; font-family: -apple-system, sans-serif; text-align: center; margin: 0; }
        .event-banner { background: #fff; color: #000; font-weight: 900; padding: 12px; font-size: 16px; text-transform: uppercase; }
        .top-nav { position: sticky; top: 0; background: var(--bg); z-index: 90; padding: 10px 0; border-bottom: 1px solid #333; }
        .match-box { background: var(--card); margin: 10px 15px; padding: 20px; border-radius: 12px; border: 1px solid #333; display: flex; justify-content: space-around; align-items: center; }
        .player-name { font-size: 24px; font-weight: 800; color: var(--accent); display: block; }
        .lists-container { padding: 0 20px 180px; text-align: left; max-width: 500px; margin: auto; }
        
        /* Non-Intrusive QR Code Card Setup */
        .qr-card { background: var(--card); border: 1px solid #333; border-radius: 12px; padding: 15px; margin-top: 15px; display: flex; align-items: center; gap: 15px; }
        .qr-wrapper { background: white; padding: 6px; border-radius: 6px; width: 75px; height: 75px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .qr-wrapper img { width: 100%; height: 100%; object-fit: contain; }
        .qr-text h4 { margin: 0 0 4px 0; font-size: 14px; font-weight: bold; }
        .qr-text p { margin: 0; font-size: 12px; opacity: 0.6; line-height: 1.3; }

        h3 { border-bottom: 1px solid #333; padding-bottom: 5px; font-size: 12px; text-transform: uppercase; opacity: 0.6; margin-top: 20px; }
        .entry { background: #1a1a1a; padding: 12px; margin-bottom: 6px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        .controls { position: fixed; bottom: 0; width: 100%; background: #111; padding: 15px; box-sizing: border-box; border-top: 1px solid #444; z-index: 100; }
        .input-group { display: flex; gap: 8px; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; font-size: 16px; }
        button { padding: 12px 24px; border-radius: 6px; border: none; font-weight: bold; background: var(--accent); color: black; cursor: pointer; }
    </style>
</head>
<body>
    <div class="event-banner">Gino & Carlo - King of the Hill</div>
    <div class="top-nav">
        <div class="match-box">
            <div class="player">
                <span id="kingName" class="player-name">---</span>
                <span id="kingStreak" style="font-size:12px; opacity:0.8;"></span>
            </div>
            <div style="opacity:0.3;">VS</div>
            <div class="player">
                <span id="chalName" class="player-name">---</span>
            </div>
        </div>
    </div>
    <div class="lists-container">
        <div class="qr-card">
            <div class="qr-wrapper">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAABmJLR0QA/wD/AP+gvaeTAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAB3RJTUUH6AMbFCo09unSmwAAAB1pVFh0Q29tbWVudAAAAAAAQ3JlYXRlZCB3aXRoIEdJTVBkLm0bAAABmklEQVR42u3YwUrDUBCE4Y7S3v//K3pRL969i8pFCv6DiLIgS9Is6Xiwz8vM7A6b7S7b9Xw+v4wxtvF8Pr+u6/rS9v00vIwxXscY96ZpfmOMp/v3N7Z96b6NMcZ9XdefuR7bV+un36fXe922fV9P/6vXN6O/Zst3ut3v0+9v9e9X/6/32779p/vX/3X6/9vW//t9tW9b/7f91/q/u97X6v9a3X/f9te/+9+uX9u/Wvv9vtY/+2vvf/t/Nf/u/+/f9f7vXt/X9fW///+9bvv/W7Xf1vrvbfW+u9fV/mP/X81/q6+9/lP/f+vft/W3vX+ffdfXe932vbZffbX9T9u39Xvff7fVv1v/X/tt39bq++v+/m2f9X//f7X6u9gX+1Xv+HbeG/r63q9u+2q/sX/1j7Uvt9t9X/p3fW5vP79bfv/m9r+V/X+rtP9bfe66/r2P1T1ff+90b79/t/vF7df2+dfvvv5Xv9v/X6zZ/v9qW9nnvj/O1/u1fK9vvY+x9bZa9n5r9XfVf9N/e2vv3fTft3OruO/+vr/p7/uYrvXb3mrtYn/Z9f+u/u5fe/vGfnrb3b/76+1Xtdb6fW/Z8p0tP/bf9t6Y9fU2tfYZa8xY3++v7Y/7vGvbtZ3tX3v9fGffW+u39f/b6v/1b///6v+9V96U/m/17/P7/t3er7W7/1Udf6b9/bL760rd6+9bZes45f56w+6b6l9WveX2Zbe/2zFttbyv1eZ7unV6p8v3/W6ve12v12vffvevdV9fa6v++u/Otvtvd//+e7uW316vX/+ur6veb+v/+n+6u7bV2rXeWq1j9P1vW/+3Zf3eN6a39u/v67N//Wf/uqy3Wuv/Vb//w/b3Xv1b/Xv/+v/GfFv6Wv/q7976N+b9vvZftO+GfTymT+b0b/62et+v/Zfu/f3W+u7XWf9O29reN9Z+v/f19reYv1V/MdaOub9W/03Vp/rv9/XWrvWf/etX2f5vtfZ/bO/3Wp/fU9u9Xfv87f2+Wre/79e/6b/at6r//f5Xm9/Xv/Xbtb69b/v6V7Xte9/f5/r9vvX/reG36L/97t8r/avtW9WvY7vfv7f1e9vvP/Pfa/v7b/Uv/fdv+/v/K6vf/+/7Xv/Z/+X7+r9av/b/F/Xf1f/7d/u/7f/vXv7V/69Vf/v6p/u9ZeuYttvS/9U+beWb/ve5P9f/Zat/S/uV3mfr/2/b9b/Z67/r/9Tee+XfN+30+z63v/+P7fV/rU2/P/6v2a5t97Wfve3NfvW7/X77f3e/rf777f9X9bveq9ff1Ww9W/vvVvUv/ef++u3rf2f9ffv1/be97e93W7v9v239f/9fX99b9VftW/9Z/fW//uv/bK/+W0zXv+v9X//X/2v/+6/W9/vW29a2/Z/+m+rv2/v/V9v3/ft7vV+vvb3XW9p/V9vev9O+bdfK/Z1u+7d1/GfXttZfa/unU9uv9/t9Nf/H2vav36z0V/fXbe/V3/Xftq0f+/XWf/vff/u36v+7NfaNfW1f3/+u79vXt5+p//6Nee93W5v+9X9f3X6f6/3ZvvNfqv/+3erftF6zD+7tW1X/qve6X9XbfbX/+rvf730ff02p/9hW/7Y2rbeO2Nq/1be9v9b2Vvv0H6Z72v/7Y//3xXre1vdX9R//aee9Xv+/atVfN6Z2Vf3btP/p7+7/K/+rbeVvW/8vrO6f6C/bfe77Y3qreL+vvtW3V91f+3atve1999u+/U6/Wn+fqt89G3b/v7Dfrt/vK7/V927V/87q37Z9v8bUbtb8             </div>
            <div class="qr-text">
                <h4>Scan to Challenge</h4>
                <p>Have an opponent ready? Let them scan this table code to log right into the active digital rail lineup.</p>
            </div>
        </div>

        <h3>Live Leaderboard</h3>
        <div id="leaderboardList"></div>
        <h3>The Rail</h3>
        <div id="railList"></div>
    </div>
    <div class="controls">
        <div class="input-group">
            <input type="text" id="nameInput" placeholder="First & Last Name (Req)">
            <button onclick="joinRail()">JOIN RAIL</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJIICqGbSr8DwyyPtG-cRCRr4W7T7xd00",
            authDomain: "the-hill-pilot.firebaseapp.com",
            projectId: "the-hill-pilot",
            storageBucket: "the-hill-pilot.firebasestorage.app",
            messagingSenderId: "965013734125",
            appId: "1:965013734125:web:bef8fbb9029fb898d742e4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const railRef = collection(db, "rail");
        const leadersRef = collection(db, "leaderboard");

        // Target Venue Location Configuration (Gino & Carlo Coordinates)
        const VENUE_GEO = { lat: 37.7996, lng: -122.4086, radiusKm: 0.075 };

        // Unique Browser Session Fingerprint Engine
        function getOrCreateSession() {
            let token = localStorage.getItem('koth_device_token');
            if (!token) {
                token = 'dev_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
                localStorage.setItem('koth_device_token', token);
            }
            return token;
        }

        // Haversine Distance Formula
        function getDistanceInKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        window.joinRail = async () => {
            const v = document.getElementById('nameInput').value.trim();
            if (v.split(' ').length < 2) {
                alert("Please enter both your First and Last name.");
                return;
            }

            if (!navigator.geolocation) {
                alert("Location checking is not supported by your device browser.");
                return;
            }

            // Trigger Geofence verification pipeline
            navigator.geolocation.getCurrentPosition(async (position) => {
                const distance = getDistanceInKm(
                    VENUE_GEO.lat,
                    VENUE_GEO.lng,
                    position.coords.latitude,
                    position.coords.longitude
                );

                if (distance <= VENUE_GEO.radiusKm) {
                    if (v) { 
                        const sessionToken = getOrCreateSession();
                        await addDoc(railRef, { 
                            name: v, 
                            time: Date.now(), 
                            status: "active", 
                            sessionWins: 0,
                            deviceId: sessionToken 
                        }); 
                        document.getElementById('nameInput').value = '';
                        alert("You're on the rail!");
                    }
                } else {
                    alert("Verification Failed: You must be physically present inside Gino & Carlo to join this rail.");
                }
            }, (error) => {
                alert("Access Denied: Location verification permissions are required to claim a spot on the rail.");
            }, { enableHighAccuracy: true, timeout: 5000 });
        };

        onSnapshot(query(railRef, orderBy("time", "asc")), (snap) => {
            const players = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p.status === "active");
            document.getElementById('kingName').innerText = players[0]?.name || "---";
            document.getElementById('kingStreak').innerText = players[0] ? `(${players[0].sessionWins || 0}/5)` : "";
            document.getElementById('chalName').innerText = players[1]?.name || "---";
            document.getElementById('railList').innerHTML = players.slice(2).map((p, i) => `
                <div class="entry">
                    <span>${i+3}. ${p.name}</span>
                </div>`).join('');
        });

        onSnapshot(query(leadersRef, orderBy("wins", "desc")), (snap) => {
            document.getElementById('leaderboardList').innerHTML = snap.docs.slice(0, 5).map((d, i) => {
                const data = d.data();
                return `<div class="entry" style="border-left: 4px solid var(--accent);">
                    <span>${i === 0 ? '👑 ' : ''}${data.name} ${data.streaks > 0 ? '🔥' : ''}</span>
                    <span style="color:var(--accent); font-weight:bold;">${data.wins} Wins</span>
                </div>`
            }).join('');
        });
    </script>
</body>
</html>
